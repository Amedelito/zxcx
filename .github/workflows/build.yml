name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Compilar
        run: |
          POM=$(find . -name pom.xml | head -1)
          echo "pom: $POM"
          cd "$(dirname "$POM")"
          mvn -B -e package
      - uses: actions/upload-artifact@v4
        with:
          name: NormsafioTablas
          path: '**/target/NormsafioTablas-*.jar'

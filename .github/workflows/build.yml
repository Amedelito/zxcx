name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Compilar
        run: |
          POM=$(find . -name pom.xml | head -1)
          echo "pom: $POM"
          cd "$(dirname "$POM")"
          mvn -B -e package 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "\[ERROR\]" build.log | head -15 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: NormsafioTablas
          path: '**/target/NormsafioTablas-*.jar'
